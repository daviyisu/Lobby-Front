<div class="container-padding column">
  <h1>{{ "recentGames.title" | translate }}</h1>
  @if (recentGames) {
    @for (game of recentGames; track game) {
      <div class="column">
        <div
          (click)="goToGame(game.id)"
          class="row gap padding dark-when-hover"
        >
          <img
            class="game-cover"
            [src]="imageService.getIgdbImage(game.coverImageId)"
          />
          <div class="column gap">
            <span class="text-lg semi-bold">{{ game.name }}</span>
            <span class="game-summary">{{ game.summary }}</span>
          </div>
        </div>
        <mat-divider></mat-divider>
      </div>
    }
    @if (recentGames.length === 0) {
      <div class="no-games">
        <img class="no-games--image" src="favicon.ico" />
        <p class="text-lg">{{ "noElements.noRecentGames" | translate }}</p>
      </div>
    }
  }
  @if (!recentGames) {
    <div class="column gap">
      @for (loader of loaders; track loader) {
        <ngx-skeleton-loader
          [theme]="{ height: '400px', width: '100%', margin: '0' }"
        ></ngx-skeleton-loader>
      }
    </div>
  }
</div>
