<main class="lb-page">
  <div>
    <h1 class="h1">{{ "recentGames.title" | translate }}</h1>
    <p class="summary lb-muted">{{ "recentGames.subtitle" | translate }}</p>
  </div>

  <div *ngIf="!recentGames" class="lb-grid" aria-busy="true">
    <div *ngFor="let l of loaders" class="lb-skel cover-skel"></div>
  </div>

  <div *ngIf="recentGames?.length" class="lb-grid">
    <app-game-card
      *ngFor="let game of recentGames"
      [game]="game"
    ></app-game-card>
  </div>

  <app-empty-state
    *ngIf="recentGames?.length === 0"
    [icon]="failed ? 'cloud_off' : 'schedule'"
    [title]="
      (failed ? 'recentGames.error.title' : 'recentGames.empty.title')
        | translate
    "
    [text]="(failed ? 'global.error' : 'noElements.noRecentGames') | translate"
  >
    <button *ngIf="!failed" mat-stroked-button (click)="shell.focusSearch()">
      <span class="lb-ic" aria-hidden="true">search</span>
      {{ "collection.empty.search" | translate }}
    </button>
  </app-empty-state>
</main>
