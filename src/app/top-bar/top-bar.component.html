<header class="bar">
  <div class="bar__in" [class.is-searching]="searchOpen">
    <a class="logo" routerLink="/mygames">
      <img src="favicon.ico" alt="" width="32" height="32" />
      <span>Lobby</span>
    </a>

    <nav class="nav" [attr.aria-label]="'nav.label' | translate">
      <a
        *ngFor="let link of links"
        [routerLink]="link.route"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >
        <span class="lb-ic" aria-hidden="true">{{ link.icon }}</span>
        {{ link.label | translate }}
      </a>
    </nav>

    <div class="search">
      <app-game-search-bar
        (selectedGameId)="goToGame($event)"
        [showShortcut]="true"
      ></app-game-search-bar>
      <button
        class="search__close"
        mat-icon-button
        (click)="searchOpen = false"
        [attr.aria-label]="'global.close' | translate"
      >
        <span class="lb-ic" aria-hidden="true">close</span>
      </button>
    </div>

    <div class="end">
      <button
        class="search-toggle"
        mat-icon-button
        (click)="openSearch()"
        [attr.aria-label]="'topBar.search' | translate"
      >
        <span class="lb-ic" aria-hidden="true">search</span>
      </button>
      <button
        mat-icon-button
        (click)="openSteamSync()"
        [attr.aria-label]="'topBar.steamSync' | translate"
      >
        <span class="lb-ic" aria-hidden="true">sync</span>
      </button>
      <button
        class="avatar-btn"
        [matMenuTriggerFor]="userMenu"
        [attr.aria-label]="'topBar.userMenu' | translate"
      >
        <img
          *ngIf="user?.avatar_url; else initialsTpl"
          class="avatar"
          [src]="user?.avatar_url"
          alt=""
        />
        <ng-template #initialsTpl>
          <span class="avatar">{{ initials }}</span>
        </ng-template>
      </button>
    </div>
  </div>
</header>

<mat-menu #userMenu="matMenu" xPosition="before" class="user-menu">
  <div class="menu-head" *ngIf="user">
    <span class="avatar">{{ initials }}</span>
    <strong>{{ user.username }}</strong>
  </div>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="openSteamSync()">
    <img src="assets/img/steam_icon.png" alt="" width="20" height="20" />
    <span>{{ "topBar.steamSync" | translate }}</span>
  </button>
  <button mat-menu-item [matMenuTriggerFor]="themeMenu">
    <span class="lb-ic" aria-hidden="true">dark_mode</span>
    <span>{{ "theme.label" | translate }}</span>
  </button>
  <button mat-menu-item [matMenuTriggerFor]="langMenu">
    <span class="lb-ic" aria-hidden="true">translate</span>
    <span>{{ "language.label" | translate }}</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <span class="lb-ic" aria-hidden="true">logout</span>
    <span>{{ "profile.logout" | translate }}</span>
  </button>
</mat-menu>

<mat-menu #themeMenu="matMenu">
  <button
    mat-menu-item
    *ngFor="let t of themeModes"
    (click)="theme.setMode(t.mode)"
    [attr.aria-checked]="theme.mode === t.mode"
    role="menuitemradio"
  >
    <span class="lb-ic" aria-hidden="true">{{ t.icon }}</span>
    <span>{{ "theme." + t.mode | translate }}</span>
    <span *ngIf="theme.mode === t.mode" class="lb-ic check" aria-hidden="true"
      >check</span
    >
  </button>
</mat-menu>

<mat-menu #langMenu="matMenu">
  <button
    mat-menu-item
    *ngFor="let lang of ['es', 'en']"
    (click)="setLanguage($any(lang))"
    role="menuitemradio"
    [attr.aria-checked]="translate.currentLang === lang"
  >
    <span>{{ "language." + lang | translate }}</span>
    <span
      *ngIf="translate.currentLang === lang"
      class="lb-ic check"
      aria-hidden="true"
      >check</span
    >
  </button>
</mat-menu>
