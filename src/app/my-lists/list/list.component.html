<main class="lb-page">
  <a mat-button class="back" routerLink="/mylists">
    <span class="lb-ic" aria-hidden="true">arrow_back</span>
    {{ "lists.title" | translate }}
  </a>

  <div class="lb-spread">
    <div>
      <h1 class="h1" *ngIf="list; else titleSkel">{{ list.name }}</h1>
      <ng-template #titleSkel>
        <div class="lb-skel" style="height: 40px; width: 280px"></div>
      </ng-template>
      <p *ngIf="list" class="summary lb-muted">
        {{ "lists.count" | translate: { count: games.length } }}
      </p>
    </div>
    <button *ngIf="list" mat-stroked-button (click)="editList()">
      <span class="lb-ic" aria-hidden="true">edit</span>
      {{ "list.editList" | translate }}
    </button>
  </div>

  <div *ngIf="!list" class="lb-grid" aria-busy="true">
    <div *ngFor="let l of loaders" class="lb-skel cover-skel"></div>
  </div>

  <div *ngIf="games.length" class="lb-grid">
    <app-game-card *ngFor="let game of games" [game]="game"></app-game-card>
  </div>

  <app-empty-state
    *ngIf="list && !games.length"
    icon="bookmarks"
    [title]="'lists.emptyList.title' | translate"
    [text]="'lists.emptyList.text' | translate"
  >
    <button mat-flat-button (click)="editList()">
      <span class="lb-ic" aria-hidden="true">add</span>
      {{ "lists.emptyList.action" | translate }}
    </button>
  </app-empty-state>
</main>
