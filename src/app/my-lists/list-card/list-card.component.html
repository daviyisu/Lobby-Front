<a class="card" [routerLink]="['/mylists', list.id]">
  <span class="mosaic">
    <ng-container *ngFor="let cover of mosaic">
      <img *ngIf="cover; else emptySlot" [src]="cover" alt="" loading="lazy" />
      <ng-template #emptySlot><span class="slot"></span></ng-template>
    </ng-container>
  </span>
  <span class="name">{{ list.name }}</span>
  <span class="meta">{{
    "lists.count" | translate: { count: gameCount }
  }}</span>
</a>
