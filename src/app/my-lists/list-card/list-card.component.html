<div (click)="goToList(list.id)" class="list-container dark-when-hover">
  <div class="cards">
    @for (image of getImagesFrontView(); track image; let i = $index) {
      <img
        [class]="'card-' + i + ' shadow'"
        [src]="image"
        alt="Cover of the game"
      />
    }
  </div>
  <h2>{{ list.name }}</h2>
</div>
