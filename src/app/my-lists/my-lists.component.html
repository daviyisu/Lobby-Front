<div class="container-padding">
  <div class="column gap-lg">
    <button
      mat-flat-button
      color="accent"
      class="btn primary"
      (click)="openCreateListModal()"
    >
      <mat-icon svgIcon="add"></mat-icon>
      <span class="text-md">
        {{ "myLists.createList" | translate }}
      </span>
    </button>
    <div class="column center gap">
      @if (userLists) {
        @for (list of userLists; track list) {
          <app-list-card [list]="list"></app-list-card>
        }
        @if (userLists.length === 0) {
          <div class="no-games">
            <img class="no-games--image" src="favicon.ico" />
            <p class="text-lg">{{ "noElements.noLists" | translate }}</p>
          </div>
        }
      }
    </div>
  </div>
</div>
