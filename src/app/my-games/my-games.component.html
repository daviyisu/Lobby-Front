<main class="lb-page">
  <div class="lb-spread">
    <div>
      <h1 class="h1">{{ "collection.title" | translate }}</h1>
      <p *ngIf="userGames?.length" class="summary lb-muted">
        {{ "collection.count" | translate: { count: userGames?.length } }}
        <ng-container *ngIf="playingCount">
          · {{ "collection.playingNow" | translate: { count: playingCount } }}
        </ng-container>
      </p>
    </div>
    <button
      *ngIf="userGames?.length"
      mat-flat-button
      (click)="shell.focusSearch()"
    >
      <span class="lb-ic" aria-hidden="true">add</span>
      {{ "collection.addGame" | translate }}
    </button>
  </div>

  <div *ngIf="userGames?.length" class="lb-spread">
    <div
      *ngIf="hasStatuses"
      class="lb-chips"
      role="toolbar"
      [attr.aria-label]="'collection.filterLabel' | translate"
    >
      <button
        class="lb-chip"
        [attr.aria-pressed]="statusFilter === null"
        (click)="setFilter(null)"
      >
        {{ "collection.all" | translate }}
        <span class="lb-chip__count">{{ userGames?.length }}</span>
      </button>
      <button
        *ngFor="let s of statusMeta"
        class="lb-chip"
        [attr.aria-pressed]="statusFilter === s.status"
        (click)="setFilter(s.status)"
      >
        <span
          class="lb-dot"
          [style.background]="'var(--status-' + s.key + ')'"
        ></span>
        {{ "gameStatus." + s.status | translate }}
        <span class="lb-chip__count">{{ countBy(s.status) }}</span>
      </button>
    </div>
    <button mat-stroked-button class="sort" [matMenuTriggerFor]="sortMenu">
      <span class="lb-ic" aria-hidden="true">swap_vert</span>
      {{ "collection.sort." + sort | translate }}
    </button>
    <mat-menu #sortMenu="matMenu" xPosition="before">
      <button mat-menu-item (click)="setSort('recent')">
        {{ "collection.sort.recent" | translate }}
      </button>
      <button mat-menu-item (click)="setSort('az')">
        {{ "collection.sort.az" | translate }}
      </button>
    </mat-menu>
  </div>

  <div *ngIf="!userGames" class="lb-grid" aria-busy="true">
    <div *ngFor="let loader of loaders" class="skeleton">
      <div class="lb-skel cover"></div>
      <div class="lb-skel line"></div>
    </div>
  </div>

  <div *ngIf="userGames && visibleGames.length" class="lb-grid">
    <app-game-card
      *ngFor="let game of visibleGames"
      [game]="game"
    ></app-game-card>
  </div>

  <app-empty-state
    *ngIf="userGames?.length === 0"
    [title]="'collection.empty.title' | translate"
    [text]="'collection.empty.text' | translate"
  >
    <button mat-flat-button (click)="shell.focusSearch()">
      <span class="lb-ic" aria-hidden="true">search</span>
      {{ "collection.empty.search" | translate }}
    </button>
    <button mat-stroked-button (click)="shell.openSteamSync()">
      <img src="assets/img/steam_icon.png" alt="" width="18" height="18" />
      {{ "collection.empty.steam" | translate }}
    </button>
  </app-empty-state>

  <app-empty-state
    *ngIf="userGames?.length && !visibleGames.length"
    icon="filter_alt_off"
    [title]="'collection.emptyFilter.title' | translate"
    [text]="'collection.emptyFilter.text' | translate"
  >
    <button mat-stroked-button (click)="setFilter(null)">
      {{ "collection.emptyFilter.action" | translate }}
    </button>
  </app-empty-state>
</main>
