<app-auth-card
  [title]="'auth.welcome' | translate"
  [subtitle]="'auth.tagline' | translate"
>
  <form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
    <mat-form-field appearance="outline">
      <mat-label>{{ "auth.username" | translate }}</mat-label>
      <span matPrefix class="lb-ic prefix" aria-hidden="true">person</span>
      <input matInput formControlName="username" autocomplete="username" />
      <mat-error>{{ "auth.usernameHint" | translate }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ "auth.password" | translate }}</mat-label>
      <span matPrefix class="lb-ic prefix" aria-hidden="true">lock</span>
      <input
        matInput
        formControlName="password"
        autocomplete="current-password"
        [type]="hide ? 'password' : 'text'"
      />
      <button
        matSuffix
        mat-icon-button
        type="button"
        (click)="hide = !hide"
        [attr.aria-label]="
          (hide ? 'auth.showPassword' : 'auth.hidePassword') | translate
        "
      >
        <span class="lb-ic" aria-hidden="true">{{
          hide ? "visibility" : "visibility_off"
        }}</span>
      </button>
      <mat-error>{{ "auth.passwordHint" | translate }}</mat-error>
    </mat-form-field>

    <p *ngIf="error" class="alert" role="alert">
      <span class="lb-ic" aria-hidden="true">error</span>
      {{ error | translate }}
    </p>

    <button mat-flat-button type="submit" class="submit" [disabled]="loading">
      {{ (loading ? "auth.loggingIn" : "auth.login") | translate }}
    </button>
  </form>

  <ng-container footer>
    {{ "auth.noAccount" | translate }}
    <a routerLink="/register">{{ "auth.createAccount" | translate }}</a>
  </ng-container>
</app-auth-card>
